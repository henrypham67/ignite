  ms-vscode-remote.remote-containers:
    job: vscode_remote_containers
    group: core
    vscode_ext: ms-vscode-remote.remote-containers
    requires: vscode
  ms-vscode-remote.remote-wsl:
    job: vscode_remote_wsl
    group: core
    platforms: [windows]
    vscode_ext: ms-vscode-remote.remote-wsl
    requires: vscode
  anthropic.claude-code:
    job: vscode_ai_assistant
    group: core
    vscode_ext: anthropic.claude-code
    requires: vscode
  vscodevim.vim:
    job: vscode_vim_keys
    group: core
    vscode_ext: vscodevim.vim
    requires: vscode
  streetsidesoftware.code-spell-checker:
    job: vscode_spell_check
    group: core
    vscode_ext: streetsidesoftware.code-spell-checker
    requires: vscode
  jeff-hykin.better-shellscript-syntax:
    job: vscode_shell_syntax
    group: core
    vscode_ext: jeff-hykin.better-shellscript-syntax
    requires: vscode
  pkief.material-icon-theme:
    job: vscode_icon_theme
    group: core
    vscode_ext: pkief.material-icon-theme
    requires: vscode
  sdras.night-owl:
    job: vscode_color_theme
    group: core
    vscode_ext: sdras.night-owl
    requires: vscode
  amazonwebservices.aws-toolkit-vscode:
    job: vscode_aws
    group: cloud-aws
    vscode_ext: amazonwebservices.aws-toolkit-vscode
    requires: vscode
  ms-toolsai.jupyter:
    job: vscode_notebooks
    group: personal
    vscode_ext: ms-toolsai.jupyter
    requires: vscode
  jebbs.plantuml:
    job: vscode_plantuml
    group: personal
    vscode_ext: jebbs.plantuml
    requires: vscode
  hediet.vscode-drawio:
    job: vscode_drawio
    group: personal
    vscode_ext: hediet.vscode-drawio
    requires: vscode
  pomdtr.excalidraw-editor:
    job: vscode_excalidraw
    group: personal
    vscode_ext: pomdtr.excalidraw-editor
    requires: vscode
  jasew.anki:
    job: vscode_anki
    group: personal
    vscode_ext: jasew.anki
    requires: vscode
  foam.foam-vscode:
    job: vscode_notes
    group: personal
    vscode_ext: foam.foam-vscode
    requires: vscode
  mechatroner.rainbow-csv:
    job: vscode_csv_view
    group: personal
    vscode_ext: mechatroner.rainbow-csv
    requires: vscode
  janisdd.vscode-edit-csv:
    job: vscode_csv_edit
    group: personal
    vscode_ext: janisdd.vscode-edit-csv
    requires: vscode
