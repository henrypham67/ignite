# Names (never values) of the secrets ignite expects. They go in
# ~/.config/ignite/secrets.env (secrets.ps1 on Windows), which the shells load
# and which is never committed. `when: gitlab` = only when the company git host
# is GitLab.
secret_names:
  - {name: GITLAB_PRIVATE_TOKEN, when: gitlab}
  - {name: GITLAB_USERNAME, when: gitlab}
